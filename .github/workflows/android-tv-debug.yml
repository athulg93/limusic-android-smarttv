name: Build Android TV test APK
on:
  push:
    branches: [build/android-tv-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build debug APK
        run: >
          ./gradlew --no-daemon --max-workers=3
          -Dorg.gradle.jvmargs=-Xmx4g
          -Pkotlin.daemon.jvmargs=-Xmx2g
          :androidApp:assembleDebug
      - name: Verify Android version, TV entry and ARM support
        run: |
          mapfile -t apks < <(find androidApp/build/outputs -type f -name '*.apk')
          printf '%s\n' "${apks[@]}"
          apk=
          for candidate in "${apks[@]}"; do
            if [[ "$candidate" == *universal*.apk ]]; then
              apk="$candidate"
              break
            fi
          done
          if [[ -z "$apk" && "${#apks[@]}" -eq 1 ]]; then
            apk="${apks[0]}"
          fi
          test -f "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$aapt" dump badging "$apk" > badging.txt
          cat badging.txt
          grep -F "sdkVersion:'26'" badging.txt
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > manifest.txt
          grep -F "com.simohypers.limusic.tv.TvActivity" manifest.txt
          grep -F "android.intent.category.LEANBACK_LAUNCHER" manifest.txt
          grep -F "'armeabi-v7a'" badging.txt
          grep -F "'arm64-v8a'" badging.txt
          apksigner="$(dirname "$aapt")/apksigner"
          "$apksigner" verify "$apk"
          mkdir -p apk-out
          cp "$apk" apk-out/Limusic-TV-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Limusic-TV-debug
          path: apk-out/Limusic-TV-debug.apk
          if-no-files-found: error
